[tool.poetry]
name = "ai-identity-system"
version = "1.0.0"
description = "Personal Digital Twin"
authors = ["Tesfahun Feleke"]

[tool.poetry.dependencies]
python = "3.12.0"
fastapi = "0.104.1"
uvicorn = {version = "0.24.0", extras = ["standard"]}
pydantic = "2.5.0"
pydantic-settings = "2.1.0"
python-dotenv = "1.0.0"
httpx = "0.25.0"
python-telegram-bot = {version = "21.6", extras = ["socks"]}
sqlalchemy = "2.0.23"
schedule = "1.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"